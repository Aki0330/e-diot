name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI / verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyber_budget_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyber_budget_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef
      APP_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyber_budget_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyber_budget_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply database migrations
        env:
          PGPASSWORD: postgres
        run: |
          for file in packages/db/migrations/*.sql; do
            psql -h localhost -U postgres -d cyber_budget_ci -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Test
        run: pnpm test
