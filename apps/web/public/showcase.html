<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-diot 智账 · 产品汇报</title>
    <style>
      /* === TOKENS === */
      :root {
        --paper: #f4f1e9;
        --paper-2: #ece8dd;
        --ink: #141518;
        --ink-2: #2b2d32;
        --muted: #6f7177;
        --line: rgba(20, 21, 24, 0.14);
        --lime: #c6f16b;
        --lime-deep: #9ccf3b;
        --dark: #101115;
        --white: #f7f5ef;
        --sans: "Noto Sans SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
        --num: "Bahnschrift", "DIN Alternate", "Noto Sans SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0c0e;
        overflow: hidden;
      }

      /* === FIXED 1920x1080 STAGE === */
      #viewport {
        position: fixed;
        inset: 0;
      }
      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1920px;
        height: 1080px;
        transform-origin: center center;
        background: var(--paper);
        overflow: hidden;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
      }

      /* === SLIDES === */
      .slide {
        position: absolute;
        inset: 0;
        padding: 76px 120px 64px;
        background: var(--paper);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      .slide.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        z-index: 2;
      }
      .slide::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(20, 21, 24, 0.04) 1px, transparent 1px);
        background-size: 100% 56px;
        opacity: 0.55;
        pointer-events: none;
      }
      .slide > * {
        position: relative;
      }
      .body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .slide.dark {
        background: var(--dark);
        color: var(--white);
      }
      .slide.dark::before {
        background-image: radial-gradient(circle at 78% 18%, rgba(198, 241, 107, 0.16), transparent 42%),
          radial-gradient(circle at 12% 92%, rgba(198, 241, 107, 0.07), transparent 40%);
      }

      /* === CHROME === */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--num);
        font-size: 18px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }
      .dark .top {
        color: rgba(247, 245, 239, 0.55);
        border-color: rgba(247, 245, 239, 0.16);
      }
      .top b {
        font-weight: 600;
        color: var(--ink);
      }
      .dark .top b {
        color: var(--white);
      }
      .foot {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: var(--num);
        font-size: 17px;
        letter-spacing: 0.12em;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      .dark .foot {
        color: rgba(247, 245, 239, 0.5);
        border-color: rgba(247, 245, 239, 0.16);
      }
      .foot .dots {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .foot .dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.25;
        transition: opacity 0.2s, transform 0.2s;
      }
      .foot .dots i.on {
        opacity: 1;
        transform: scale(1.35);
        background: var(--lime-deep);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 104px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 900;
      }
      h1 em {
        font-style: normal;
        color: var(--ink);
        background: var(--lime);
        padding: 0 0.06em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      h2 {
        font-size: 66px;
        line-height: 1.12;
        letter-spacing: -0.03em;
        font-weight: 900;
        margin-top: 42px;
      }
      .lead {
        margin-top: 26px;
        font-size: 29px;
        line-height: 1.62;
        color: var(--ink-2);
        max-width: 1180px;
      }
      .dark .lead {
        color: rgba(247, 245, 239, 0.72);
      }
      .small {
        font-size: 20px;
        line-height: 1.6;
        color: var(--muted);
      }
      .dark .small {
        color: rgba(247, 245, 239, 0.55);
      }

      /* === COVER === */
      .cover {
        padding: 90px 120px 64px;
      }
      .cover-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1.12fr 0.88fr;
        gap: 70px;
        align-items: center;
      }
      .brandrow {
        font-family: var(--num);
        font-size: 19px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(247, 245, 239, 0.55);
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .brandrow b {
        color: var(--lime);
        font-weight: 600;
      }
      .cover h1 {
        margin-top: 34px;
        font-size: 112px;
      }
      .cover .lead {
        color: rgba(247, 245, 239, 0.72);
        max-width: 840px;
      }
      .cover-meta {
        margin-top: 44px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-family: var(--num);
        font-size: 17px;
        letter-spacing: 0.08em;
        color: rgba(247, 245, 239, 0.68);
      }
      .cover-meta span {
        border: 1px solid rgba(247, 245, 239, 0.22);
        border-radius: 999px;
        padding: 9px 16px;
      }
      .cover-meta span.hot {
        background: var(--lime);
        border-color: var(--lime);
        color: var(--ink);
        font-weight: 600;
      }
      .cover-phone {
        display: flex;
        justify-content: center;
      }
      .cover-phone img {
        height: 740px;
        width: auto;
        border-radius: 30px;
        border: 7px solid #2a2c31;
        box-shadow: 0 50px 110px rgba(0, 0, 0, 0.55);
      }

      /* === PROBLEM SCENES === */
      .scenes {
        margin-top: 38px;
        border-top: 1px solid var(--line);
      }
      .scene {
        display: grid;
        grid-template-columns: 190px 1fr;
        gap: 34px;
        align-items: baseline;
        padding: 30px 0;
        border-bottom: 1px solid var(--line);
      }
      .scene .time {
        font-family: var(--num);
        font-size: 21px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .scene p {
        font-size: 31px;
        line-height: 1.5;
      }
      .scene p b {
        font-weight: 700;
      }
      .afterline {
        margin-top: 34px;
        font-size: 26px;
        color: var(--ink-2);
      }
      .afterline b {
        background: linear-gradient(transparent 62%, var(--lime) 62%);
      }

      /* === FLOW === */
      .flow {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        margin-top: 40px;
      }
      .step {
        border-top: 3px solid var(--ink);
        padding-top: 22px;
        position: relative;
      }
      .step .n {
        font-family: var(--num);
        font-size: 20px;
        color: var(--muted);
        letter-spacing: 0.1em;
      }
      .step h3 {
        margin-top: 12px;
        font-size: 30px;
        font-weight: 800;
      }
      .step p {
        margin-top: 12px;
        font-size: 21px;
        line-height: 1.6;
        color: var(--muted);
      }
      .example {
        margin-top: 44px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.42);
      }
      .example > div {
        padding: 26px 30px;
      }
      .example > div + div {
        border-left: 1px solid var(--line);
      }
      .example .label {
        font-family: var(--num);
        font-size: 17px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .example p {
        margin-top: 12px;
        font-size: 27px;
        line-height: 1.5;
      }

      /* === DEMO PHONES === */
      .phones {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 54px;
        align-items: center;
        margin-top: 10px;
      }
      .phones figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .phones img {
        height: 620px;
        width: auto;
        border-radius: 26px;
        border: 6px solid #2a2c31;
        box-shadow: 0 34px 80px rgba(0, 0, 0, 0.45);
      }
      .phones figcaption {
        font-size: 21px;
        color: rgba(247, 245, 239, 0.72);
      }

      /* === COMPARE TABLE === */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 34px;
        font-size: 22px;
        line-height: 1.45;
      }
      th,
      td {
        text-align: left;
        padding: 18px 16px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        font-family: var(--num);
        font-size: 17px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
        border-bottom: 1px solid var(--ink);
      }
      td:first-child {
        font-weight: 700;
        color: var(--ink);
        width: 210px;
      }
      td {
        color: var(--ink-2);
      }
      td.us {
        color: var(--ink);
        font-weight: 700;
        background: rgba(198, 241, 107, 0.22);
      }

      /* === TRUST POINTS === */
      .points {
        margin-top: 34px;
        border-top: 1px solid var(--line);
      }
      .point {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 30px;
        padding: 30px 0;
        border-bottom: 1px solid var(--line);
        align-items: baseline;
      }
      .point .n {
        font-family: var(--num);
        font-size: 44px;
        color: var(--lime-deep);
        line-height: 1;
      }
      .point h3 {
        font-size: 30px;
        font-weight: 800;
      }
      .point p {
        margin-top: 8px;
        font-size: 22px;
        color: var(--muted);
        line-height: 1.55;
      }

      /* === TIMELINE === */
      .timeline {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 26px;
        margin-top: 40px;
      }
      .phase {
        border-top: 3px solid var(--ink);
        padding-top: 22px;
      }
      .phase .when {
        font-family: var(--num);
        font-size: 18px;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .phase h3 {
        margin-top: 14px;
        font-size: 30px;
        font-weight: 800;
      }
      .phase p {
        margin-top: 12px;
        font-size: 21px;
        line-height: 1.6;
        color: var(--ink-2);
      }
      .phase .ok {
        margin-top: 16px;
        font-size: 18px;
        color: var(--muted);
        border-left: 3px solid var(--lime-deep);
        padding-left: 10px;
      }

      /* === ENDING === */
      .ending {
        padding: 90px 120px 64px;
      }
      .ending h2 {
        margin-top: 60px;
        font-size: 84px;
      }
      .ending .lead {
        max-width: 980px;
      }
      .cta-row {
        margin-top: 46px;
        display: flex;
        gap: 14px;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 16px 30px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--ink);
        font-size: 22px;
        font-weight: 700;
        text-decoration: none;
      }
      .cta.ghost {
        background: transparent;
        border: 1px solid rgba(247, 245, 239, 0.28);
        color: var(--white);
        font-weight: 500;
      }
      .team {
        margin-top: 40px;
        font-family: var(--num);
        font-size: 18px;
        letter-spacing: 0.06em;
        color: rgba(247, 245, 239, 0.55);
      }
      .mark {
        position: absolute;
        right: -30px;
        bottom: 110px;
        font-family: var(--num);
        font-size: 300px;
        font-weight: 700;
        line-height: 0.8;
        letter-spacing: -0.05em;
        color: transparent;
        -webkit-text-stroke: 1px rgba(198, 241, 107, 0.2);
        pointer-events: none;
        user-select: none;
      }

      /* === MOTION === */
      .slide.active .anim {
        animation: rise 0.6s cubic-bezier(0.22, 0.9, 0.24, 1) both;
      }
      .slide.active .anim:nth-child(2) {
        animation-delay: 0.06s;
      }
      .slide.active .anim:nth-child(3) {
        animation-delay: 0.12s;
      }
      .slide.active .anim:nth-child(4) {
        animation-delay: 0.18s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .slide.active .anim {
          animation: none;
        }
        .slide {
          transition: none;
        }
      }

      /* === HUD (outside stage) === */
      .hud {
        position: fixed;
        right: 20px;
        bottom: 16px;
        font-family: var(--num);
        font-size: 13px;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.5);
        z-index: 10;
        user-select: none;
      }
      .hud b {
        color: var(--lime);
      }
      .progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background: var(--lime);
        width: 0;
        z-index: 10;
        transition: width 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div class="progress" id="bar"></div>
    <div id="viewport"><div id="stage"></div></div>

    <template id="deck">
      <!-- 01 封面 -->
      <section class="slide dark cover">
        <div class="top">
          <span><b>E-DIOT</b> · 智账</span>
          <span>2026.11 · 产品汇报</span>
        </div>
        <div class="cover-grid">
          <div>
            <div class="brandrow anim">记录你的日常 <b>/</b> 说人话记账</div>
            <h1 class="anim">记一笔账，<br /><em>一句话</em>就够了。</h1>
            <p class="lead anim">
              说「午饭 38，打车 26」，两笔账一起记好。月底它会告诉你，钱花在哪。
            </p>
            <div class="cover-meta anim">
              <span class="hot">现场体验 127.0.0.1:8000</span>
              <span>6 个页面</span>
              <span>188 个测试</span>
            </div>
          </div>
          <div class="cover-phone anim">
            <img src="/showcase/m-chat.png" alt="一句话记两笔账" />
          </div>
        </div>
        <div class="foot">
          <span>E-DIOT · 智账</span>
          <span class="dots"></span>
          <span>01</span>
        </div>
      </section>

      <!-- 02 问题 -->
      <section class="slide">
        <div class="top">
          <span><b>01</b> · 问题</span>
          <span>为什么记不下去</span>
        </div>
        <h2 class="anim">我们问了一圈，<br />坚持记账的人比想象中少。</h2>
        <div class="scenes">
          <div class="scene anim">
            <span class="time">22:41</span>
            <p>想记一笔，打开 App 要选分类、填金额、挑日期。<b>到家就忘了。</b></p>
          </div>
          <div class="scene anim">
            <span class="time">月底</span>
            <p>记了一个月，只记得一个总数，<b>说不出钱花在哪。</b></p>
          </div>
          <div class="scene anim">
            <span class="time">超支后</span>
            <p>唯一一次提醒，是弹窗说<b>「我又超了」</b>。</p>
          </div>
        </div>
        <p class="afterline anim">太麻烦、没用、烦。三件事，我们一次解决一个。</p>
        <div class="foot">
          <span>E-DIOT · 智账</span>
          <span class="dots"></span>
          <span>02</span>
        </div>
      </section>

      <!-- 03 怎么做 -->
      <section class="slide">
        <div class="top">
          <span><b>02</b> · 怎么做</span>
          <span>一条账的旅程</span>
        </div>
        <h2 class="anim">一句话进来，<br />四步之后变成月底能看的东西。</h2>
        <div class="flow">
          <div class="step anim">
            <div class="n">01 听懂</div>
            <h3>拆成两笔</h3>
            <p>「午饭 38，打车 26」一次拆成两笔。</p>
          </div>
          <div class="step anim">
            <div class="n">02 拆账</div>
            <h3>记进账本</h3>
            <p>该记的记下；说不清的地方，会再问一句。</p>
          </div>
          <div class="step anim">
            <div class="n">03 对预算</div>
            <h3>当场算</h3>
            <p>这个月还剩多少，记完就知道。</p>
          </div>
          <div class="step anim">
            <div class="n">04 给结论</div>
            <h3>月底说人话</h3>
            <p>给三条结论，每条都能点回账单。</p>
          </div>
        </div>
        <div class="example anim">
          <div>
            <div class="label">你说</div>
            <p>今天午饭花了 38，下午打车 26</p>
          </div>
          <div>
            <div class="label">系统记</div>
            <p>餐饮 38 · 交通 26，两笔一次记好</p>
          </div>
        </div>
        <div class="foot">
          <span>E-DIOT · 智账</span>
          <span class="dots"></span>
          <span>03</span>
        </div>
      </section>

      <!-- 04 现场演示 -->
      <section class="slide dark">
        <div class="top">
          <span><b>03</b> · 现在能用</span>
          <span>截图来自当前版本</span>
        </div>
        <h2 class="anim">这些不是设计稿，<br />是今天打开的版本。</h2>
        <div class="phones">
          <figure class="anim">
            <img src="/showcase/m-chat.png" alt="对话记账" />
            <figcaption>说一句，两笔一起记好</figcaption>
          </figure>
          <figure class="anim">
            <img src="/showcase/m-dashboard.png" alt="本月总览" />
            <figcaption>这个月花了多少，还剩多少</figcaption>
          </figure>
          <figure class="anim">
            <img src="/showcase/m-bills.png" alt="账单流水" />
            <figcaption>每一笔都能查、能改</figcaption>
          </figure>
        </div>
        <div class="foot">
          <span>E-DIOT · 智账</span>
          <span class="dots"></span>
          <span>04</span>
        </div>
      </section>

      <!-- 05 对比 -->
      <section class="slide">
        <div class="top">
          <span><b>04</b> · 和谁比</span>
          <span>记完之后</span>
        </div>
        <h2 class="anim">都是记账，<br />差别在记完之后。</h2>
        <table class="anim">
          <thead>
            <tr>
              <th></th>
              <th>传统记账 App</th>
              <th>通用 AI 助手</th>
              <th>银行账单</th>
              <th>E-diot</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>记一笔</td>
              <td>8 步表单</td>
              <td>要自己整理</td>
              <td>自动，但只有银行卡</td>
              <td class="us">一句话，多笔一起记</td>
            </tr>
            <tr>
              <td>预算</td>
              <td>通常只管总数</td>
              <td>没有</td>
              <td>没有</td>
              <td class="us">分类预算，超了才提醒</td>
            </tr>
            <tr>
              <td>改错账</td>
              <td>能</td>
              <td>在聊天记录里翻</td>
              <td>不能</td>
              <td class="us">每笔都能改、能删</td>
            </tr>
            <tr>
              <td>数据在哪</td>
              <td>各家 App 里</td>
              <td>对话里</td>
              <td>银行</td>
              <td class="us">自己的库，能导出</td>
            </tr>
            <tr>
              <td>换工具</td>
              <td>迁移麻烦</td>
              <td>没有账本</td>
              <td>绑卡</td>
              <td class="us">开放接口</td>
            </tr>
          </tbody>
        </table>
        <div class="foot">
          <span>E-DIOT · 智账</span>
          <span class="dots"></span>
          <span>05</span>

    <script>
      // === FIXED STAGE ===
      const stage = document.getElementById("stage");
      const slides = [...document.getElementById("deck").content.querySelectorAll(".slide")];
      slides.forEach((slide) => stage.appendChild(slide));

      const total = slides.length;

      // Center each slide's content between the header and footer.
      slides.forEach((slide) => {
        if (slide.classList.contains("cover")) return;
        const top = slide.querySelector(".top");
        const foot = slide.querySelector(".foot");
        if (!foot) return;
        const body = document.createElement("div");
        body.className = "body";
        [...slide.children].forEach((child) => {
          if (child !== top && child !== foot) body.appendChild(child);
        });
        slide.insertBefore(body, foot);
      });

      // page dots
      slides.forEach((slide, i) => {
        const dots = slide.querySelector(".dots");
        if (dots) {
          for (let d = 0; d < total; d++) dots.appendChild(document.createElement("i"));
        }
      });

      let index = 0;
      function render() {
        slides.forEach((slide, i) => {
          slide.classList.toggle("active", i === index);
          slide.querySelectorAll(".dots i").forEach((dot, d) => {
            dot.classList.toggle("on", d === index);
          });
        });
        document.getElementById("bar").style.width = ((index + 1) / total) * 100 + "%";
      }
      function go(next) {
        index = Math.max(0, Math.min(total - 1, next));
        render();
      }

      // fit stage into viewport, keep 16:9
      function fit() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
      window.addEventListener("resize", fit);
      fit();

      window.addEventListener("keydown", (e) => {
        if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) {
          e.preventDefault();
          go(index + 1);
        }
        if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) {
          e.preventDefault();
          go(index - 1);
        }
        if (e.key === "Home") go(0);
        if (e.key === "End") go(total - 1);
      });

      // click right/left half to navigate (outside interactive elements)
      stage.addEventListener("click", (e) => {
        if (e.target.closest("a,button")) return;
        const rect = stage.getBoundingClientRect();
        go(index + (e.clientX - rect.left > rect.width / 2 ? 1 : -1));
      });

      window.addEventListener("hashchange", () => {
        const m = location.hash.match(/^#(\d+)$/);
        if (m) go(Number(m[1]) - 1);
      });

      const initial = location.hash.match(/^#(\d+)$/);
      go(initial ? Number(initial[1]) - 1 : 0);
    </script>
